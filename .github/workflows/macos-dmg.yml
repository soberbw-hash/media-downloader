name: 打包 macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的版本号标签（如 v1.24.1）'
        required: false
        default: 'v1.24.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 已于 2026-11-02 退役；macos-15 是 arm64，带 -intel 的是 x86_64
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 编译 .app 并压 DMG
        run: bash tools/build_macos_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: '*.dmg'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 收齐两个架构的 DMG
        uses: actions/download-artifact@v4
        with:
          path: dmgs
          pattern: dmg-*
          merge-multiple: true

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          ls -lh dmgs/
          cat > notes.md <<'EOF'
          ## 音视频下载器 · Mac 版

          **两个包长得不一样，只下一个就行：**

          | 你的 Mac | 下这个 |
          |---|---|
          | 关于本机里写「芯片 Apple M1 / M2 / M3 / M4」 | **M系列芯片版**.dmg |
          | 关于本机里写「处理器 Intel」 | **Intel芯片版**.dmg |

          不知道芯片型号：点屏幕左上角  → 「关于本机」，看「芯片」或「处理器」那一行。
          下错了打不开而已，删掉换另一个重下，不会有别的影响。

          双击 DMG，把 App 拖进「应用程序」。第一次打开请**右键 → 打开**，
          或先在终端跑一次：

          ```
          xattr -dr com.apple.quarantine "/Applications/音视频下载器.app"
          ```

          没有 Apple 开发者签名，所以 macOS 会先拦一下，只需处理一次。
          Python、ffmpeg、下载内核都打进包里了，不用另外装任何东西。
          下好的文件默认在「下载 / 音视频下载器」。DMG 里附了中文说明。
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "音视频下载器 $TAG · Mac 版（按芯片选包）" --notes-file notes.md
          fi
          # 先把这个发布页上的旧资产全清掉，再上传本次的两个包。
          # 顺序保证新包不会被清掉；也不做文件名比对（中文名在 shell/jq 里容易被拆坏）。
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
          for aid in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            echo "清掉旧资产 id=$aid"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" >/dev/null
          done
          # gh release upload 会把中文资产名剥成 "-1.24.1-M.dmg" 这种残缺名，
          # 所以走官方上传接口，用 name= 显式指定（URL 编码后的完整中文名）。
          UPLOAD="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets"
          for f in dmgs/*.dmg; do
            name=$(basename "$f")
            enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$name")
            echo "上传: $name"
            curl -fsS --max-time 600 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "$UPLOAD?name=$enc" >/dev/null
          done
          echo "本次资产："
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          # 名字没保住就让它红，别悄悄发出一个认不出来的包
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name | select(contains("芯片版"))] | length' | grep -qx 2
