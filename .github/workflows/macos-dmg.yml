name: 发布 Mac DMG（保留同页 Windows 包）

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的版本号标签（如 v1.24.3）'
        required: false
        default: 'v1.24.3'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    # 只发 Apple 芯片版；macos-15 是 arm64 runner（macos-14 已于 2026-11-02 退役）
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 编译 .app 并压 DMG
        run: bash tools/build_macos_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-arm64
          path: '*.dmg'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 取回 DMG
        uses: actions/download-artifact@v4
        with:
          name: dmg-arm64
          path: dmgs

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          ls -lh dmgs/
          VER="${TAG#v}"
          # 同一个发布页上还挂着 Windows 的 zip（由 tools/make_clean_copy.py 本机生成后上传）。
          # 这里只重打 Mac 包，说明写全两个平台，别把 Windows 包删了。
          cat > notes.md <<'EOF'
          ## 音视频下载器 VERTAG

          **一个页面，两个包，按自己电脑的系统下就行：**

          | 系统 | 下载 |
          |---|---|
          | Windows | `VideoDL-VERTAG-Windows.zip` |
          | Mac（Apple M1 / M2 / M3 / M4） | `VideoDL-VERTAG-Apple-M-Mac.dmg` |

          **Windows**：解压到任意文件夹，双击「音视频下载器.exe」。Python、ffmpeg、下载内核都在包里，什么都不用装；下载的文件默认在解压出来的「下载的文件」里。公司电脑若拦 exe，就双击「音视频下载器-公司」。

          **Mac**：双击 DMG，把 App 拖进「应用程序」。第一次打开请**右键 → 打开**，或先在终端跑一次：

          ```
          xattr -dr com.apple.quarantine "/Applications/音视频下载器.app"
          ```

          没有 Apple 开发者签名，macOS 会先拦一下，处理一次就好。不知道芯片型号：点屏幕左上角  → 「关于本机」，看「芯片」那一行是不是「Apple M…」。Intel 芯片的 Mac 暂时没有安装包，可下本仓库源码双击 `启动.command` 运行，功能一样。

          少数平台要登录：右上角「账号」→ 点「一键装小助手」，照着三步装一次；之后每个平台点「打开」、在浏览器里登录，回来就是「已登录」。
          EOF
          sed -i "s/VERTAG/$VER/g" notes.md
          TITLE="音视频下载器 $TAG · Windows + Mac"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" \
              -f "name=$TITLE" >/dev/null
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file notes.md
          fi
          # 只清旧 DMG，Windows zip 原样留着。用 jq 按后缀筛，别在 shell 里比对文件名
          # （中文名曾被 IFS/grep 拆坏，把刚上传的包也删了，job 还是绿的）。
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
          for aid in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" \
                         --jq '.assets[] | select(.name | endswith(".dmg")) | .id'); do
            echo "清掉旧 DMG id=$aid"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" >/dev/null
          done
          gh release upload "$TAG" dmgs/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          echo "本次资产："
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          # 不变式：DMG 恰好一个、名字能看出是 Apple 芯片专用
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                   --jq '[.assets[] | select(.name | endswith(".dmg"))] | length')" = "1"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -q 'Apple-M-Mac'
