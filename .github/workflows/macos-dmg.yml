name: 打包 macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布用的版本号标签（如 v1.24.3）'
        required: false
        default: 'v1.24.3'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    # 只发 Apple 芯片版；macos-15 是 arm64 runner（macos-14 已于 2026-11-02 退役）
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 编译 .app 并压 DMG
        run: bash tools/build_macos_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-arm64
          path: '*.dmg'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 取回 DMG
        uses: actions/download-artifact@v4
        with:
          name: dmg-arm64
          path: dmgs

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -e
          ls -lh dmgs/
          cat > notes.md <<'EOF'
          ## 音视频下载器 · Mac 版（Apple 芯片专用）

          **只有一个包，不用挑。** 这一版只给 Apple 芯片的 Mac
          （M1 / M2 / M3 / M4）。不知道自己芯片：点屏幕左上角  → 「关于本机」，
          看「芯片」那一行写的是不是「Apple M…」。

          Intel 芯片的 Mac 暂时没有安装包，下了也打不开。想用的话去本仓库
          下源码，双击 `启动.command` 就能跑，功能一样。

          双击 DMG，把 App 拖进「应用程序」。第一次打开请**右键 → 打开**，
          或先在终端跑一次：

          ```
          xattr -dr com.apple.quarantine "/Applications/音视频下载器.app"
          ```

          没有 Apple 开发者签名，所以 macOS 会先拦一下，只需处理一次。
          Python、ffmpeg、下载内核都打进包里了，不用另外装任何东西。
          下好的文件默认在「下载 / 音视频下载器」。DMG 里附了中文说明。
          EOF
          TITLE="音视频下载器 $TAG · Mac 版（Apple 芯片专用）"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" \
              -f "name=$TITLE" >/dev/null
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file notes.md
          fi
          # 先把这个发布页上的旧包（含之前 Intel 版、残缺中文名）全清掉再上传，
          # 保证页面上永远只有一个包，不用再教人分辨。
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')
          for aid in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" --jq '.[].id'); do
            echo "清掉旧资产 id=$aid"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$aid" >/dev/null
          done
          gh release upload "$TAG" dmgs/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          echo "本次资产："
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          # 只准有一个包，且名字要能看出是 Apple 芯片专用
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                   --jq '.assets | length')" = "1"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -q 'Apple-M-Mac'
